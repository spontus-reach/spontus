name: Bug or workflow problem
description: Report a repo, automation, product, or process issue.
title: "fix: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GitHub automation
        - Skill or agent workflow
        - Notion/process organization
        - Product prototype
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Provide exact steps, links, command output, or screenshots if available.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      placeholder: Who is blocked and how severe is it?
    validations:
      required: true
