name: Discord Notifications

on:
  push:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - closed
      - ready_for_review
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created
  discussion_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: discord-notify-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.comment.id || github.event.review.id || github.sha }}
  cancel-in-progress: true

jobs:
  notify:
    name: Post to Discord
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip discord]')) && (github.event_name != 'discussion_comment' || (github.event.action == 'created' && github.event.discussion.title == 'Daily GitHub Change Log')) }}

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_DAILY_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_UPDATES_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        shell: bash
        run: |
          set -euo pipefail

          is_discord_webhook_url() {
            [[ "$1" =~ ^https://(discord|discordapp)\.com/api/webhooks/[0-9]+/.+ ]]
          }

          webhook_url=""
          if [[ "${EVENT_NAME}" == "discussion_comment" ]]; then
            if is_discord_webhook_url "${DISCORD_DAILY_UPDATES_WEBHOOK_URL:-}"; then
              webhook_url="${DISCORD_DAILY_UPDATES_WEBHOOK_URL}"
            else
              echo "::warning::DISCORD_DAILY_UPDATES_WEBHOOK_URL is missing or invalid. Falling back to DISCORD_WEBHOOK_URL."
              if is_discord_webhook_url "${DISCORD_WEBHOOK_URL:-}"; then
                webhook_url="${DISCORD_WEBHOOK_URL}"
              fi
            fi
          elif is_discord_webhook_url "${DISCORD_WEBHOOK_URL:-}"; then
            webhook_url="${DISCORD_WEBHOOK_URL}"
          else
            echo "::warning::DISCORD_WEBHOOK_URL is missing or invalid."
          fi

          if [[ -z "${webhook_url:-}" ]]; then
            if [[ "${EVENT_NAME}" == "discussion_comment" ]]; then
              echo "No valid Discord webhook is configured. Skipping daily update notification."
            else
              echo "No valid Discord webhook is configured. Skipping Discord notification."
            fi
            exit 0
          fi

          payload="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          action = os.environ.get("EVENT_ACTION", "")
          repo = os.environ["REPO"]
          actor = os.environ["ACTOR"]
          event_payload = {}
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if event_path and Path(event_path).exists():
              event_payload = json.loads(Path(event_path).read_text())

          def embed(title, description, color, url=None):
              item = {
                  "title": title[:256],
                  "description": description[:4096],
                  "color": color,
              }
              if url:
                  item["url"] = url
              return item

          if event == "push":
              commits = event_payload.get("commits", [])
              commit_message = os.environ.get("COMMIT_MESSAGE", "").splitlines()[0]
              sha = os.environ["SHA"][:7]
              commit_url = os.environ.get("COMMIT_URL") or f"https://github.com/{repo}/commit/{sha}"
              branch = os.environ["REF_NAME"]
              commit_count = len(commits)
              headline = f"Push to {branch}"
              description = (
                  f"**Repo:** {repo}\n"
                  f"**Branch:** {branch}\n"
                  f"**Author:** {actor}\n"
                  f"**Commits:** {commit_count or 1}\n"
                  f"**Latest:** [{sha}]({commit_url})\n"
                  f"**Message:** {commit_message or '(no message)'}"
              )
              embeds = [embed(headline, description, 5763719, commit_url)]

          elif event == "pull_request":
              title = os.environ.get("PR_TITLE", "Pull request update")
              url = os.environ.get("PR_URL", "")
              number = os.environ.get("PR_NUMBER", "")
              merged = os.environ.get("PR_MERGED", "false") == "true"

              if action == "closed" and merged:
                  headline = f"PR merged #{number}"
                  color = 5763719
              elif action == "closed":
                  headline = f"PR closed #{number}"
                  color = 10070709
              elif action == "opened":
                  headline = f"PR opened #{number}"
                  color = 3447003
              elif action == "ready_for_review":
                  headline = f"PR ready for review #{number}"
                  color = 15844367
              else:
                  headline = f"PR updated #{number}"
                  color = 9807270

              description = (
                  f"**Repo:** {repo}\n"
                  f"**Title:** {title}\n"
                  f"**Author:** {os.environ.get('PR_USER', actor)}\n"
                  f"**Action:** {action or 'updated'}"
              )
              embeds = [embed(headline, description, color, url or None)]

          elif event == "issues":
              title = os.environ.get("ISSUE_TITLE", "Issue update")
              url = os.environ.get("ISSUE_URL", "")
              number = os.environ.get("ISSUE_NUMBER", "")

              if action == "opened":
                  headline = f"Issue opened #{number}"
                  color = 15844367
              elif action == "reopened":
                  headline = f"Issue reopened #{number}"
                  color = 15844367
              elif action == "edited":
                  headline = f"Issue edited #{number}"
                  color = 9807270
              else:
                  headline = f"Issue closed #{number}"
                  color = 10070709

              description = (
                  f"**Repo:** {repo}\n"
                  f"**Title:** {title}\n"
                  f"**Author:** {os.environ.get('ISSUE_USER', actor)}\n"
                  f"**Action:** {action or 'updated'}"
              )
              embeds = [embed(headline, description, color, url or None)]

          elif event == "issue_comment":
              issue = event_payload.get("issue", {})
              comment = event_payload.get("comment", {})
              number = issue.get("number", "")
              title = issue.get("title", "Issue or PR comment")
              url = comment.get("html_url") or issue.get("html_url", "")
              author = comment.get("user", {}).get("login", actor)
              body = comment.get("body", "").strip().splitlines()
              first_line = next((line.strip() for line in body if line.strip()), "(no comment body)")
              item_type = "PR" if "pull_request" in issue else "Issue"
              headline = f"{item_type} comment #{number}"
              description = (
                  f"**Repo:** {repo}\n"
                  f"**Title:** {title}\n"
                  f"**Author:** {author}\n"
                  f"**Comment:** {first_line[:500]}"
              )
              embeds = [embed(headline, description, 9807270, url or None)]

          elif event == "pull_request_review":
              pull_request = event_payload.get("pull_request", {})
              review = event_payload.get("review", {})
              number = pull_request.get("number", "")
              title = pull_request.get("title", "Pull request review")
              url = review.get("html_url") or pull_request.get("html_url", "")
              author = review.get("user", {}).get("login", actor)
              state = review.get("state", "submitted").replace("_", " ").title()
              body = review.get("body", "").strip().splitlines()
              first_line = next((line.strip() for line in body if line.strip()), "(no review body)")
              description = (
                  f"**Repo:** {repo}\n"
                  f"**Title:** {title}\n"
                  f"**Reviewer:** {author}\n"
                  f"**State:** {state}\n"
                  f"**Note:** {first_line[:500]}"
              )
              embeds = [embed(f"PR review #{number}", description, 9807270, url or None)]

          elif event == "pull_request_review_comment":
              pull_request = event_payload.get("pull_request", {})
              comment = event_payload.get("comment", {})
              number = pull_request.get("number", "")
              title = pull_request.get("title", "Pull request review comment")
              url = comment.get("html_url") or pull_request.get("html_url", "")
              author = comment.get("user", {}).get("login", actor)
              body = comment.get("body", "").strip().splitlines()
              first_line = next((line.strip() for line in body if line.strip()), "(no comment body)")
              path = comment.get("path", "")
              description = (
                  f"**Repo:** {repo}\n"
                  f"**Title:** {title}\n"
                  f"**Author:** {author}\n"
                  f"**File:** {path or '(not provided)'}\n"
                  f"**Comment:** {first_line[:500]}"
              )
              embeds = [embed(f"PR review comment #{number}", description, 9807270, url or None)]

          elif event == "discussion_comment":
              discussion = event_payload.get("discussion", {})
              comment = event_payload.get("comment", {})
              title = discussion.get("title", "Discussion update")
              discussion_url = discussion.get("html_url", "")
              url = comment.get("html_url") or discussion_url
              author = comment.get("user", {}).get("login", actor)
              body = comment.get("body", "").strip()
              lines = [line.strip() for line in body.splitlines()]
              heading = next((line.lstrip("# ").strip() for line in lines if line.startswith("## ")), title)

              bullets = []
              in_summary = False
              for line in lines:
                  normalized = line.strip()
                  if normalized.lower() in {"### summary", "summary"}:
                      in_summary = True
                      continue
                  if in_summary and normalized.startswith("### "):
                      break
                  if in_summary and normalized.startswith("- "):
                      bullets.append(normalized)
                  if len(bullets) == 6:
                      break

              if not bullets and body:
                  bullets = [body[:500]]

              description = (
                  f"**Repo:** {repo}\n"
                  f"**Discussion:** [{title}]({discussion_url or url})\n"
                  f"**Author:** {author}\n\n"
                  + "\n".join(bullets[:6])
              )
              embeds = [embed(heading, description, 5763719, url or None)]

          elif event == "workflow_dispatch":
              description = (
                  f"**Repo:** {repo}\n"
                  f"**Actor:** {actor}\n"
                  "**Purpose:** Manual Discord notification test"
              )
              embeds = [embed("Manual Discord test", description, 9807270)]

          else:
              description = f"**Repo:** {repo}\n**Event:** {event}\n**Actor:** {actor}"
              embeds = [embed("GitHub activity", description, 9807270)]

          print(json.dumps({
              "username": "Spontus GitHub",
              "embeds": embeds,
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            -X POST "${webhook_url}" \
            -H "Content-Type: application/json" \
            -d "${payload}"
