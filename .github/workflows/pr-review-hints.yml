name: PR Review Hints

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hints:
    name: Advisory PR review hints
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build review hints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" --json body,changedFiles,title > pr.json
          gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > changed-files.txt

          node tools/pr-review-hints.js pr.json changed-files.txt > pr-review-hints.json

      - name: Apply labels and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          labels="$(node -e "const r=require('./pr-review-hints.json'); console.log(r.labels.join(','))")"
          if [[ -n "$labels" ]]; then
            IFS=',' read -ra label_array <<< "$labels"
            for label in "${label_array[@]}"; do
              gh label create "$label" --color "fbca04" --description "Advisory review hint label" 2>/dev/null || true
            done
            gh issue edit "$PR_NUMBER" --add-label "$labels"
          fi

          node -e "const fs=require('fs'); const r=require('./pr-review-hints.json'); fs.writeFileSync('pr-review-hints.md', r.comment)"

          existing_comment_id="$(
            gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | contains("<!-- spontus-pr-review-hints -->")) | .id' \
              | head -n 1
          )"

          if [[ -n "${existing_comment_id:-}" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${existing_comment_id}" \
              --field body="$(cat pr-review-hints.md)" >/dev/null
          else
            gh issue comment "$PR_NUMBER" --body-file pr-review-hints.md
          fi

          cat pr-review-hints.md >> "$GITHUB_STEP_SUMMARY"
