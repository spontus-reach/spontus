name: Actionlint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/actionlint.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/workflows/actionlint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
